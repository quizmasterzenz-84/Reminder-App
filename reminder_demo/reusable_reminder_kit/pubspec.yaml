name: reusable_reminder_kit
description: >
  Reminder-agnostic building blocks pulled out of the Offline Smart Reminder
  app so they can be reused in this app AND copied whole into future apps
  (habit tracker, medication log, task app, etc). No external packages,
  no network access needed — works fully offline.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
